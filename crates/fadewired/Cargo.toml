[package]
name = "fadewired"
description = "FadeWire daemon: reads hardware faders and drives PipeWire sink/stream volumes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
fadewire-core = { path = "../fadewire-core" }
anyhow = "1"
# PulseAudio client API — served by pipewire-pulse. Needs libpulse at
# build/run time (Arch: libpulse; Debian/CI: libpulse-dev).
libpulse-binding = "2"
# hidraw access to the fader device (usage-page matching works for USB and
# BLE). Builds the bundled C hidapi; needs libudev (Arch: systemd-libs;
# Debian/CI: libudev-dev).
hidapi = "2"
# Session-bus service for the CLI/GUI (pure Rust).
zbus = "5"
